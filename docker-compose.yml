# Local Neo4j for the real knowledge-graph backend.
#
#   docker compose up -d neo4j        # start the database
#   docker compose run --rm loader    # load data/kg_triples.json
#   NEO4J_URI=bolt://localhost:7687 NEO4J_PASSWORD=testpassword \
#       python main.py --drug SHP099 --target SHP2
#
# The JSON snapshot in data/ stays the default so the prototype runs with no
# database at all; this file is for when you want the real thing.

services:
  neo4j:
    image: neo4j:5-community
    container_name: medscriptai-neo4j
    environment:
      NEO4J_AUTH: neo4j/testpassword
      NEO4J_server_memory_heap_max__size: 512M
    ports:
      - "7474:7474"      # browser
      - "7687:7687"      # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p testpassword 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  loader:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
    command: ["python", "scripts/load_neo4j.py", "--uri", "bolt://neo4j:7687"]

volumes:
  neo4j_data:
