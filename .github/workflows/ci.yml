name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # the learned components are part of what ships, so CI installs them
          pip install langgraph rdkit
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: pytest -q

      - name: Run tests on the LangGraph engine
        env:
          USE_LANGGRAPH: "1"
        run: pytest -q

      - name: Smoke-test the CLI (no API keys)
        run: python main.py --demo > /dev/null
